<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Stopwatch</title>
</head>
<body>

    <div id="cps-tester">
        <div id="scoreboard">
            <div id="t1">
                <label>Time</label>
                <p id="time-display">00:00</p>
            </div>
            
            <div id="t2">
                <label>Clicks</label>
                <p id="click-display">0</p>
            </div>
            
            <div id="t3">
                <label>CPS</label>
                <p id="cps-display">0</p>
            </div>
        </div>
        <div id="cps-box">
            <button id="click-box">Click Here to START</button>
        </div>
        
        <div id="timer-selector">
            <button onclick="setTimer(1)" id="timer-button">1s</button>
            <button onclick="setTimer(3)" id="timer-button">3s</button>
            <button onclick="setTimer(5)" id="timer-button">5s</button>
            <button onclick="setTimer(10)" id="timer-button">10s</button>
            <button onclick="setTimer(30)" id="timer-button">30s</button>
        </div>

        <div id="reset-container">
            <button onclick="reset()">Reset</button>
        </div>

        <p id="record-label">Records</p>
        <div id="records">
            <div id="record-list">
                
                
            </div>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
